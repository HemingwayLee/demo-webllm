<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- WebLLM Example Client: a chat bubble, since it chats using the manager's models.
       Teal-to-blue so it's easy to tell apart from the manager's purple icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- speech bubble with a tail at the bottom left -->
  <rect x="22" y="28" width="84" height="60" rx="18" fill="#FFFFFF"/>
  <path d="M38 84 L32 104 L58 86 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  <!-- "typing" dots -->
  <g fill="#0F766E">
    <circle cx="44" cy="58" r="7"/>
    <circle cx="64" cy="58" r="7"/>
    <circle cx="84" cy="58" r="7"/>
  </g>
</svg>
