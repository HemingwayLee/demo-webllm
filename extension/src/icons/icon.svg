<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- WebLLM Model Manager: a GPU chip (models run on the GPU) with an AI sparkle -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g fill="#FFFFFF" opacity="0.85">
    <!-- chip pins: top, bottom, left, right -->
    <rect x="45" y="20" width="8" height="14" rx="3"/>
    <rect x="60" y="20" width="8" height="14" rx="3"/>
    <rect x="75" y="20" width="8" height="14" rx="3"/>
    <rect x="45" y="94" width="8" height="14" rx="3"/>
    <rect x="60" y="94" width="8" height="14" rx="3"/>
    <rect x="75" y="94" width="8" height="14" rx="3"/>
    <rect x="20" y="45" width="14" height="8" rx="3"/>
    <rect x="20" y="60" width="14" height="8" rx="3"/>
    <rect x="20" y="75" width="14" height="8" rx="3"/>
    <rect x="94" y="45" width="14" height="8" rx="3"/>
    <rect x="94" y="60" width="14" height="8" rx="3"/>
    <rect x="94" y="75" width="14" height="8" rx="3"/>
  </g>
  <rect x="30" y="30" width="68" height="68" rx="14" fill="#FFFFFF"/>
  <!-- AI sparkle: a large four-point star with a small one beside it -->
  <g fill="#5B3FE6">
    <path d="M60 44 Q62.5 65.5 84 68 Q62.5 70.5 60 92 Q57.5 70.5 36 68 Q57.5 65.5 60 44 Z"/>
    <path d="M83 36 Q84.2 44.8 93 46 Q84.2 47.2 83 56 Q81.8 47.2 73 46 Q81.8 44.8 83 36 Z"/>
  </g>
</svg>
